name: Core RustSec Lock Candidate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Audited Core Cargo.lock candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require read-only private-core token
        shell: bash
        env:
          CORE_READ_TOKEN: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CORE_READ_TOKEN" || { echo "Missing FANCYDASHBOARD_CORE_READ_TOKEN"; exit 1; }

      - name: Checkout FancyDashboard release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: klabacher/FancyDashboard
          ref: release/v1-hardening
          path: core
          token: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libpcap-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Upgrade only known vulnerable dependency lines
        working-directory: core/apps/host/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo update -p plist@1.8.0 --precise 1.10.0
          cargo update -p maxminddb
          cargo update -p bytes@1.11.0
          cargo update -p crossbeam-epoch@0.9.18
          cargo update -p h2@0.4.12
          cargo update -p rustls-webpki@0.103.8
          echo '=== resolved security-sensitive versions ==='
          cargo tree | grep -E 'plist v|quick-xml v|bytes v|crossbeam-epoch v|h2 v|maxminddb v|rustls-webpki v' | sort -u

      - name: Require zero known RustSec vulnerabilities
        working-directory: core/apps/host/src-tauri
        run: cargo audit

      - name: Verify Rust formatting
        working-directory: core/apps/host/src-tauri
        run: cargo fmt --all -- --check

      - name: Verify Rust compilation
        working-directory: core/apps/host/src-tauri
        run: cargo check --locked --all-targets

      - name: Verify Clippy with warnings denied
        working-directory: core/apps/host/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: core/apps/host/src-tauri
        run: cargo test --locked --all

      - name: Package candidate and audit evidence
        working-directory: core/apps/host/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.candidate"
          git diff -- Cargo.lock > "$RUNNER_TEMP/core-cargo-lock.patch"
          cargo audit > "$RUNNER_TEMP/core-rustsec-final.txt" 2>&1
          test -s "$RUNNER_TEMP/core-cargo-lock.patch"

      - name: Upload audited lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fancydashboard-core-audited-cargo-lock
          path: |
            ${{ runner.temp }}/Cargo.lock.candidate
            ${{ runner.temp }}/core-cargo-lock.patch
            ${{ runner.temp }}/core-rustsec-final.txt
          if-no-files-found: error
          retention-days: 7
