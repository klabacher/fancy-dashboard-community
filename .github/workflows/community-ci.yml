name: Community CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository and release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify release metadata and repository hygiene
        run: node scripts/verify-release.mjs

      - name: Validate every package.json
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find packages create-fancy-community -name package.json -type f | sort)

      - name: Smoke-test community scaffolder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/packs/modules/ci-scaffold
          node create-fancy-community/bin.js ci-scaffold
          test -f packages/packs/modules/ci-scaffold/package.json
          test -f packages/packs/modules/ci-scaffold/src/manifest.ts
          if node create-fancy-community/bin.js ../escape; then
            echo "Scaffolder accepted an unsafe pack id"
            exit 1
          fi
          rm -rf packages/packs/modules/ci-scaffold

      - name: Reject generated artifacts and placeholder integrity
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)(node_modules|dist)/' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            exit 1
          fi
          if grep -RInE '0{64}' packages/packs --include='*.ts' --include='*.json'; then
            echo "Placeholder integrity found"
            exit 1
          fi

      - name: Smoke-test release gate without publishing
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/community-release-output
          GITHUB_OUTPUT=/tmp/community-release-output node scripts/check-release-bump.mjs
          grep -Eq '^release=(true|false)$' /tmp/community-release-output
          grep -Eq '^version=[0-9]+\.[0-9]+\.[0-9]+' /tmp/community-release-output
          cat /tmp/community-release-output

      - name: Prove Community release packager is deterministic
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          rm -rf /tmp/community-input /tmp/community-publish-a /tmp/community-publish-b
          mkdir -p /tmp/community-input/artifacts
          printf 'community-release-smoke\n' > /tmp/community-input/artifacts/ci-smoke-1.0.0.zip
          HASH=$(sha256sum /tmp/community-input/artifacts/ci-smoke-1.0.0.zip | awk '{print $1}')
          node - "$HASH" <<'NODE'
          const fs = require('fs');
          const integrity = process.argv[2];
          fs.writeFileSync('/tmp/community-input/catalog.json', JSON.stringify([{
            id: 'ci-smoke',
            version: '1.0.0',
            name: 'CI Smoke',
            summary: 'Synthetic artifact used only to verify deterministic release packaging.',
            artifact: 'ci-smoke-1.0.0.zip',
            integrity,
          }], null, 2) + '\n');
          NODE
          node scripts/package-community-release.mjs --input /tmp/community-input --output /tmp/community-publish-a --version "$VERSION"
          node scripts/package-community-release.mjs --input /tmp/community-input --output /tmp/community-publish-b --version "$VERSION"
          cmp "/tmp/community-publish-a/FancyDashboard-Community-$VERSION.zip" "/tmp/community-publish-b/FancyDashboard-Community-$VERSION.zip"
          cmp /tmp/community-publish-a/SHA256SUMS.txt /tmp/community-publish-b/SHA256SUMS.txt
          cmp /tmp/community-publish-a/catalog.json /tmp/community-publish-b/catalog.json

      - name: Smoke-test release notes generation
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/generate-release-notes.mjs \
            --version "$VERSION" \
            --base BOOTSTRAP \
            --head HEAD \
            --checksums /tmp/community-publish-a/SHA256SUMS.txt \
            --output /tmp/COMMUNITY_RELEASE_NOTES.md
          grep -q "FancyDashboard Community v$VERSION" /tmp/COMMUNITY_RELEASE_NOTES.md
          grep -q 'SHA-256' /tmp/COMMUNITY_RELEASE_NOTES.md
          grep -q 'Commits incluídos' /tmp/COMMUNITY_RELEASE_NOTES.md

      - name: Explain authoritative cross-repo build gate
        run: |
          echo "Full SDK/runtime compatibility is intentionally validated by FancyDashboard core CI."
          echo "Community release CI performs a second full composite build against compatibility.json before publishing."
