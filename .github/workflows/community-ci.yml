name: Community CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository and release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Verify release metadata and repository hygiene
        run: node scripts/verify-release.mjs

      - name: Validate every package.json
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find packages create-fancy-community -name package.json -type f | sort)

      - name: Smoke-test community scaffolder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/packs/modules/ci-scaffold
          node create-fancy-community/bin.js ci-scaffold
          test -f packages/packs/modules/ci-scaffold/package.json
          test -f packages/packs/modules/ci-scaffold/src/manifest.ts
          if node create-fancy-community/bin.js ../escape; then
            echo "Scaffolder accepted an unsafe pack id"
            exit 1
          fi
          rm -rf packages/packs/modules/ci-scaffold

      - name: Reject generated artifacts and placeholder integrity
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)(node_modules|dist)/' || true)
          if [ -n "$tracked" ]; then
            echo "$tracked"
            exit 1
          fi
          if grep -RInE '0{64}' packages/packs --include='*.ts' --include='*.json'; then
            echo "Placeholder integrity found"
            exit 1
          fi

      - name: Smoke-test release gate
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/community-release-gate.txt
          GITHUB_OUTPUT=/tmp/community-release-gate.txt node scripts/check-release-bump.mjs
          grep -Eq '^release=(true|false)$' /tmp/community-release-gate.txt
          grep -q '^version=1.0.0$' /tmp/community-release-gate.txt
          grep -q '^core_tag=v1.0.0$' /tmp/community-release-gate.txt

      - name: Smoke-test deterministic packager and release notes
        shell: bash
        env:
          GITHUB_REPOSITORY: klabacher/fancy-dashboard-community
        run: |
          set -euo pipefail
          rm -rf /tmp/community-release-smoke
          mkdir -p /tmp/community-release-smoke/input/artifacts /tmp/community-release-smoke/output
          printf '{"id":"ci","version":"1.0.0","name":"CI","summary":"smoke","artifact":"ci-1.0.0.zip","integrity":"%064d"}\n' 1 \
            | node -e 'const fs=require("fs"); const [line]=fs.readFileSync(0,"utf8").trim().split("\n"); fs.writeFileSync(process.argv[1], JSON.stringify([JSON.parse(line)], null, 2)+"\n")' /tmp/community-release-smoke/input/catalog.json
          printf 'community-smoke' > /tmp/community-release-smoke/input/artifacts/ci-1.0.0.zip
          node -e 'const fs=require("fs"),crypto=require("crypto");const p="/tmp/community-release-smoke/input/catalog.json";const c=JSON.parse(fs.readFileSync(p));c[0].integrity=crypto.createHash("sha256").update(fs.readFileSync("/tmp/community-release-smoke/input/artifacts/ci-1.0.0.zip")).digest("hex");fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          node scripts/package-community-release.mjs --input /tmp/community-release-smoke/input --output /tmp/community-release-smoke/output --version 1.0.0
          test -f /tmp/community-release-smoke/output/FancyDashboard-Community-1.0.0.zip
          test -f /tmp/community-release-smoke/output/SHA256SUMS.txt
          test -f /tmp/community-release-smoke/output/INSTALLATION.md
          node scripts/generate-release-notes.mjs --version 1.0.0 --base "$(git rev-parse HEAD^)" --head HEAD --checksums /tmp/community-release-smoke/output/SHA256SUMS.txt --output /tmp/community-release-smoke/output/RELEASE_NOTES.md
          grep -q 'FancyDashboard Community v1.0.0' /tmp/community-release-smoke/output/RELEASE_NOTES.md
          grep -q 'SHA-256' /tmp/community-release-smoke/output/RELEASE_NOTES.md

      - name: Explain authoritative cross-repo build gate
        run: |
          echo "Full SDK/runtime compatibility is intentionally validated by FancyDashboard core CI."
          echo "Community release CI performs a second full composite build against compatibility.json before publishing."

  core-quick-xml-diagnostic:
    name: Core quick-xml dependency trace
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require read-only private-core token
        shell: bash
        env:
          CORE_READ_TOKEN: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CORE_READ_TOKEN" || { echo "Missing FANCYDASHBOARD_CORE_READ_TOKEN"; exit 1; }

      - name: Checkout FancyDashboard release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: klabacher/FancyDashboard
          ref: release/v1-hardening
          path: core
          token: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Trace quick-xml reverse dependency and compatible parent versions
        working-directory: core/apps/host/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          echo '=== quick-xml 0.38.4 reverse dependency tree ==='
          cargo tree -i quick-xml@0.38.4 --edges all
          echo '=== quick-xml entries in the resolved graph ==='
          cargo tree --edges all | grep -E 'quick-xml|plist|tauri|windows|cargo' || true

  core-release-candidate:
    name: Core RC RustSec contingency gate
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require read-only private-core token
        shell: bash
        env:
          CORE_READ_TOKEN: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CORE_READ_TOKEN" || { echo "Missing FANCYDASHBOARD_CORE_READ_TOKEN"; exit 1; }

      - name: Checkout FancyDashboard release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: klabacher/FancyDashboard
          ref: release/v1-hardening
          path: core
          token: ${{ secrets.FANCYDASHBOARD_CORE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libpcap-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Capture baseline RustSec findings
        working-directory: core/apps/host/src-tauri
        shell: bash
        run: |
          set +e
          cargo audit | tee "$RUNNER_TEMP/core-rustsec-baseline.txt"
          status=${PIPESTATUS[0]}
          echo "Baseline cargo-audit exit code: $status"
          exit 0

      - name: Generate targeted audited lockfile candidate
        working-directory: core/apps/host/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo update -p maxminddb || true
          cargo update -p bytes@1.11.0 || true
          cargo update -p crossbeam-epoch@0.9.18 || true
          cargo update -p h2@0.4.12 || true
          cargo update -p quick-xml@0.38.4 || true
          cargo update -p rustls-webpki@0.103.8 || true
          cargo audit
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
          git diff -- Cargo.lock > "$RUNNER_TEMP/core-cargo-lock.patch"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.candidate"

      - name: Upload audited Cargo.lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fancydashboard-core-audited-cargo-lock
          path: |
            ${{ runner.temp }}/Cargo.lock.candidate
            ${{ runner.temp }}/core-cargo-lock.patch
            ${{ runner.temp }}/core-rustsec-baseline.txt
          if-no-files-found: error
          retention-days: 7
