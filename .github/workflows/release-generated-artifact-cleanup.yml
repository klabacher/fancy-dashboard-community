name: Release generated artifact cleanup

on:
  push:
    branches:
      - release/v1-responsive-hardening
    paths:
      - .github/workflows/release-generated-artifact-cleanup.yml

permissions:
  contents: write

concurrency:
  group: release-community-generated-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1-responsive-hardening
          fetch-depth: 0
      - name: Audit tracked generated files
        shell: bash
        run: |
          node_count=$(git ls-files | grep -Ec '(^|/)node_modules/' || true)
          dist_count=$(git ls-files | grep -Ec '(^|/)dist/' || true)
          echo "tracked node_modules files: ${node_count}"
          echo "tracked dist files: ${dist_count}"
      - name: Remove only generated paths from Git
        shell: bash
        run: |
          git ls-files -z \
            | python -c 'import sys; data=sys.stdin.buffer.read().split(b"\0"); sys.stdout.buffer.write(b"\0".join(p for p in data if p and (b"/node_modules/" in b"/"+p or b"/dist/" in b"/"+p)) + b"\0")' \
            | xargs -0 -r git rm -f --
      - name: Verify deletion scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only --diff-filter=D | grep -Ev '(^|/)(node_modules|dist)/' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected deletions outside generated paths:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff --stat
      - name: Commit generated artifact cleanup
        run: |
          if git diff --quiet; then
            echo "No tracked generated artifacts remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(repo): remove tracked generated artifacts"
          git fetch origin release/v1-responsive-hardening
          git rebase origin/release/v1-responsive-hardening
          git push origin HEAD:release/v1-responsive-hardening
