name: Release PC Monitor permission migration

on:
  push:
    branches:
      - release/v1-responsive-hardening
    paths:
      - .github/workflows/release-pc-monitor-permissions.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1-responsive-hardening
          fetch-depth: 0

      - name: Apply PC Monitor caller identity and declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"drift: expected block missing in {path}")
              p.write_text(text.replace(old, new, count))

          replace(
              "packages/packs/modules/pc-monitor/src/module/index.ts",
              "  globalPermissions: [],",
              '  globalPermissions: [\n    { kind: "system:specs" },\n    { kind: "system:telemetry" },\n  ],',
          )

          replace(
              "packages/packs/modules/pc-monitor/src/module/hooks/useTelemetrySubscription.ts",
              "          const specsResponse = await SystemActions.getSpecs.invoke();",
              '          const specsResponse = await SystemActions.getSpecs.invoke(\n            undefined,\n            "pc-monitor"\n          );',
          )
          replace(
              "packages/packs/modules/pc-monitor/src/module/hooks/useTelemetrySubscription.ts",
              '''            (payload) => {\n              updateFromTelemetry(payload);\n              setConnected(true);\n            }\n          );''',
              '''            (payload) => {\n              updateFromTelemetry(payload);\n              setConnected(true);\n            },\n            "pc-monitor",\n            "system:telemetry"\n          );''',
          )

          replace(
              "packages/packs/modules/pc-monitor/src/module/PCMonitor.tsx",
              "        const specsResponse = await SystemActions.getSpecs.invoke();",
              '        const specsResponse = await SystemActions.getSpecs.invoke(\n          undefined,\n          "pc-monitor"\n        );',
          )
          replace(
              "packages/packs/modules/pc-monitor/src/module/PCMonitor.tsx",
              '''            setStats({\n              cpu: {\n                usage: Math.round(payload.cpu_usage),\n                temperature: Math.round(cpuTemp),\n                name: specs?.cpu_brand ?? "CPU",\n                cores: specs?.physical_cores ?? 0,\n              },\n              ram: {\n                used: ramUsedGB,\n                total: ramTotalGB,\n                percentage:\n                  ramTotalGB > 0\n                    ? Math.round((ramUsedGB / ramTotalGB) * 100)\n                    : 0,\n              },\n            });\n          }\n        );''',
              '''            setStats({\n              cpu: {\n                usage: Math.round(payload.cpu_usage),\n                temperature: Math.round(cpuTemp),\n                name: specs?.cpu_brand ?? "CPU",\n                cores: specs?.physical_cores ?? 0,\n              },\n              ram: {\n                used: ramUsedGB,\n                total: ramTotalGB,\n                percentage:\n                  ramTotalGB > 0\n                    ? Math.round((ramUsedGB / ramTotalGB) * 100)\n                    : 0,\n              },\n            });\n          },\n          "pc-monitor",\n          "system:telemetry"\n        );''',
          )
          PY

      - name: Verify migration diff
        run: |
          git diff --check
          git diff -- \
            packages/packs/modules/pc-monitor/src/module/index.ts \
            packages/packs/modules/pc-monitor/src/module/PCMonitor.tsx \
            packages/packs/modules/pc-monitor/src/module/hooks/useTelemetrySubscription.ts

      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/packs/modules/pc-monitor/src/module
          git commit -m "fix(pc-monitor): declare native system permissions"
          git fetch origin release/v1-responsive-hardening
          git rebase origin/release/v1-responsive-hardening
          git push origin HEAD:release/v1-responsive-hardening
