name: Release weather responsive hardening

on:
  push:
    branches:
      - release/v1-responsive-hardening
    paths:
      - .github/workflows/release-weather-responsive.yml

permissions:
  contents: write

concurrency:
  group: release-weather-responsive-hardening
  cancel-in-progress: false

jobs:
  patch-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1-responsive-hardening
          fetch-depth: 0
      - name: Apply container-aware Weather layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/packs/modules/weather/src/module/WeatherWidget.tsx")
          text = path.read_text()

          old_import = 'import { useState, useEffect, memo } from "react";'
          new_import = 'import { useState, useEffect, useRef, memo } from "react";'
          if old_import not in text:
              raise SystemExit("Weather React import drifted")
          text = text.replace(old_import, new_import, 1)

          marker = "// ============================================================================\n// Main Weather Widget Component\n// ============================================================================\n"
          helper = '''// ============================================================================\n// Container-aware responsive layout\n// ============================================================================\n\nfunction resolveWeatherSize(\n  width: number,\n  height: number,\n  fallback: WeatherConfig["size"]\n): WeatherConfig["size"] {\n  if (width <= 0 || height <= 0) return fallback;\n  if (width < 240 || height < 190) return "1x1";\n  if (height < 250 && width >= 300) return "2x1";\n  if (width >= 720 && height >= 560) return "4x4";\n  if (width >= 520 && height >= 420) return "3x3";\n  return "2x2";\n}\n\n'''
          if marker not in text:
              raise SystemExit("Weather main component marker drifted")
          text = text.replace(marker, helper + marker, 1)

          old_header = '''export default function WeatherWidget(_props: WidgetRuntimeProps) {\n  const { config: runtimeConfig } = usePluginContext();\n  const config = runtimeConfig as unknown as WeatherConfig;\n  const { data, loading, error, lastUpdated } = useWeather(config);\n  const [debugState, setDebugState] = useState<WeatherState | "">("");\n\n  if (error && !data) {\n    return (\n      <div className="w-full h-full rounded-[2.5rem] bg-slate-900/90 backdrop-blur-xl flex flex-col items-center justify-center text-white p-6 shadow-2xl border border-slate-700">\n        <AlertTriangle className="text-red-400 mb-4" size={48} />\n        <h3 className="font-semibold text-xl">Weather Unavailable</h3>\n        <p className="text-slate-400 text-sm mt-2 text-center">{error}</p>\n      </div>\n    );\n  }\n\n  // Console debug commands (development only)\n'''
          new_header = '''export default function WeatherWidget(_props: WidgetRuntimeProps) {\n  const { config: runtimeConfig } = usePluginContext();\n  const config = runtimeConfig as unknown as WeatherConfig;\n  const { data, loading, error, lastUpdated } = useWeather(config);\n  const [debugState, setDebugState] = useState<WeatherState | "">("");\n  const rootRef = useRef<HTMLDivElement | null>(null);\n  const [layoutSize, setLayoutSize] = useState<WeatherConfig["size"]>(config.size);\n\n  useEffect(() => {\n    const element = rootRef.current;\n    if (!element || typeof ResizeObserver === "undefined") return;\n\n    const updateSize = (width: number, height: number) => {\n      setLayoutSize((previous) => {\n        const next = resolveWeatherSize(width, height, config.size);\n        return previous === next ? previous : next;\n      });\n    };\n\n    const observer = new ResizeObserver((entries) => {\n      const entry = entries[0];\n      if (entry) updateSize(entry.contentRect.width, entry.contentRect.height);\n    });\n\n    const rect = element.getBoundingClientRect();\n    updateSize(rect.width, rect.height);\n    observer.observe(element);\n    return () => observer.disconnect();\n  }, [config.size]);\n\n  // Console debug commands (development only)\n'''
          if old_header not in text:
              raise SystemExit("Weather component header drifted")
          text = text.replace(old_header, new_header, 1)

          after_debug = '''  }, []);\n\n  // State Resolution\n'''
          error_block = '''  }, []);\n\n  if (error && !data) {\n    return (\n      <div className="flex h-full w-full min-h-0 min-w-0 flex-col items-center justify-center overflow-hidden rounded-[clamp(1rem,6cqi,2.5rem)] border border-slate-700 bg-slate-900/90 p-[clamp(0.75rem,5cqi,1.5rem)] text-center text-white shadow-2xl backdrop-blur-xl">\n        <AlertTriangle className="mb-3 text-red-400" size={40} aria-hidden="true" />\n        <h3 className="text-[clamp(1rem,7cqi,1.25rem)] font-semibold">Weather Unavailable</h3>\n        <p className="mt-2 max-w-full truncate text-[clamp(0.7rem,4cqi,0.875rem)] text-slate-400">{error}</p>\n      </div>\n    );\n  }\n\n  // State Resolution\n'''
          if after_debug not in text:
              raise SystemExit("Weather debug hook ending drifted")
          text = text.replace(after_debug, error_block, 1)

          old_switch = "    switch (config.size) {"
          if old_switch not in text:
              raise SystemExit("Weather layout switch drifted")
          text = text.replace(old_switch, "    switch (layoutSize) {", 1)

          old_root = '''    <motion.div\n      layout\n      className={`relative overflow-hidden rounded-[2.5rem] shadow-2xl transition-all duration-700 ease-out bg-linear-to-br ${theme.theme} flex flex-col justify-between group select-none w-full h-full`}'''
          new_root = '''    <motion.div\n      ref={rootRef}\n      layout\n      className={`relative h-full w-full min-h-0 min-w-0 overflow-hidden rounded-[clamp(1rem,5cqi,2.5rem)] shadow-2xl transition-all duration-700 motion-reduce:transition-none ease-out bg-linear-to-br ${theme.theme} flex flex-col justify-between group select-none`}'''
          if old_root not in text:
              raise SystemExit("Weather root container drifted")
          text = text.replace(old_root, new_root, 1)

          old_padding = '''        padding: layoutConfig.isSmall\n          ? "1rem"\n          : layoutConfig.isGiant\n            ? "2.5rem"\n            : "1.5rem",'''
          new_padding = '''        padding: layoutConfig.isSmall\n          ? "clamp(0.5rem, 4cqi, 1rem)"\n          : layoutConfig.isGiant\n            ? "clamp(1.5rem, 5cqi, 2.5rem)"\n            : "clamp(0.75rem, 4cqi, 1.5rem)",'''
          if old_padding not in text:
              raise SystemExit("Weather padding block drifted")
          text = text.replace(old_padding, new_padding, 1)

          path.write_text(text)
          PY
      - name: Verify generated diff
        run: |
          git diff --check
          git diff -- packages/packs/modules/weather/src/module/WeatherWidget.tsx
      - name: Commit Weather hardening
        run: |
          if git diff --quiet; then
            echo "Weather hardening already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/packs/modules/weather/src/module/WeatherWidget.tsx
          git commit -m "fix(weather): adapt layout to widget viewport"
          git fetch origin release/v1-responsive-hardening
          git rebase origin/release/v1-responsive-hardening
          git push origin HEAD:release/v1-responsive-hardening
